services:
  mongo_db:
    container_name: db_container
    image: mongo:7
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "3030:3030"
    depends_on:
      - mongo_db
    restart: on-failure

volumes:
  mongo_data:
